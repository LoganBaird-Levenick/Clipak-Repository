id: org.kernel.usbutils
name: usbutils
version: '017'
summary: Inspect host USB bus topology and connected hardware
description: usbutils contains lsusb and utilities for inspecting devices connected
  to the host USB controllers.
license: GPL-2.0-or-later
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: lsusb
  summary: USB device inspection tool
curation:
  unconfined_reason: Requires access to /dev/bus/usb and /sys/bus/usb
  required_host_capabilities:
  - raw-devices
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-usbutils
    command: 'mkdir -p "${DESTDIR}/bin"

      cp -a /usr/bin/lsusb "${DESTDIR}/bin/lsusb" 2>/dev/null || which lsusb >/dev/null
      2>&1 && cp -a $(which lsusb) "${DESTDIR}/bin/lsusb" || true

      chmod +x "${DESTDIR}/bin/lsusb" 2>/dev/null || true'
