id: org.kernel.usbutils
name: usbutils
version: '017'
summary: Inspect host USB bus topology and connected hardware
description: usbutils contains lsusb and utilities for inspecting devices connected
  to the host USB controllers.
license: GPL-2.0-or-later
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: lsusb
  summary: USB device inspection tool
curation:
  unconfined_reason: Requires access to /dev/bus/usb and /sys/bus/usb
  required_host_capabilities:
  - raw-devices
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-usbutils
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which lsusb >/dev/null 2>&1; then\n\
      \    cp -aL $(which lsusb) \"${DESTDIR}/bin/lsusb\"\n    chmod +x \"${DESTDIR}/bin/lsusb\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/lsusb\"\n#!/bin/sh\n\
      echo \"usbutils 017 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/lsusb\"\
      \nfi"
