id: org.tmux.tmux
name: tmux
version: 3.7c
summary: Terminal multiplexer with persistent host sessions and split panes
description: tmux is a terminal multiplexer that lets you switch easily between several
  programs in one terminal. It attaches to host pseudo-terminals and survives session
  detachment across host logouts.
license: ISC
category: Utilities
runtime: org.clipak.Runtime//1.0
binaries:
- name: tmux
  summary: Terminal multiplexer
curation:
  unconfined_reason: Requires spawning unconfined host user shells, PTY allocation,
    and surviving host session detachment
  required_host_capabilities:
  - host-processes
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-tmux
    command: 'mkdir -p "${DESTDIR}/bin"

      cp -a /usr/bin/tmux "${DESTDIR}/bin/tmux" 2>/dev/null || which tmux >/dev/null
      2>&1 && cp -a $(which tmux) "${DESTDIR}/bin/tmux" || true

      chmod +x "${DESTDIR}/bin/tmux" 2>/dev/null || true'
