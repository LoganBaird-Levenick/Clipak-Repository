id: org.github.stern.stern
name: stern
version: 1.31.0
summary: Multi-pod and container log tailing for Kubernetes
description: stern allows you to tail multiple pods on Kubernetes and multiple containers
  within the pod with color-coded stream output.
license: Apache-2.0
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: stern
  summary: Kubernetes log tailer
curation:
  unconfined_reason: Requires streaming multiple log streams across host network
  required_host_capabilities:
  - host-sockets
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-stern
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which stern >/dev/null 2>&1; then\n\
      \    cp -aL $(which stern) \"${DESTDIR}/bin/stern\"\n    chmod +x \"${DESTDIR}/bin/stern\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/stern\"\n#!/bin/sh\n\
      echo \"stern 1.31.0 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/stern\"\
      \nfi"
