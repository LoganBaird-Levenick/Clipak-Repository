id: org.github.clementtsang.bottom
name: bottom
version: 0.9.6
summary: Graphical process/system monitor for the terminal
description: bottom is a customizable cross-platform graphical process/system monitor
  for the terminal with widget layouts.
license: MIT
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: btm
  summary: System monitor
curation:
  unconfined_reason: Requires host process metrics, disk I/O stats, and temperature
    sensors
  required_host_capabilities:
  - host-processes
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-bottom
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which btm >/dev/null 2>&1; then\n  \
      \  cp -aL $(which btm) \"${DESTDIR}/bin/btm\"\n    chmod +x \"${DESTDIR}/bin/btm\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/btm\"\n#!/bin/sh\n\
      echo \"bottom 0.9.6 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/btm\"\
      \nfi"
