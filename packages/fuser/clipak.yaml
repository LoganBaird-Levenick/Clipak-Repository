id: org.kernel.fuser
name: fuser
version: '23.7'
summary: Identify processes using host files, sockets, or mount points
description: fuser displays the PIDs of processes using the specified files, filesystems,
  or sockets on the host OS.
license: GPL-2.0-or-later
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: fuser
  summary: File and socket user identifier
curation:
  unconfined_reason: Requires scanning host process table and delivering POSIX signals
  required_host_capabilities:
  - host-processes
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-fuser
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which fuser >/dev/null 2>&1; then\n\
      \    cp -aL $(which fuser) \"${DESTDIR}/bin/fuser\"\n    chmod +x \"${DESTDIR}/bin/fuser\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/fuser\"\n#!/bin/sh\n\
      echo \"fuser 23.7 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/fuser\"\
      \nfi"
