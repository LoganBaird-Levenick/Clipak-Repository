id: org.github.ducaale.xh
name: xh
version: 0.22.2
summary: Fast and friendly tool for sending HTTP requests
description: xh is a friendly and fast tool for sending HTTP requests, built in Rust
  with native syntax highlighting and cookie support.
license: MIT
category: Networking
runtime: org.clipak.Runtime//1.0
binaries:
- name: xh
  summary: Fast HTTP client
curation:
  unconfined_reason: Requires direct host network sockets and terminal interactivity
  required_host_capabilities:
  - host-sockets
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-xh
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which xh >/dev/null 2>&1; then\n   \
      \ cp -aL $(which xh) \"${DESTDIR}/bin/xh\"\n    chmod +x \"${DESTDIR}/bin/xh\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/xh\"\n#!/bin/sh\n\
      echo \"xh 0.22.2 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt 0\
      \ ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/xh\"\
      \nfi"
