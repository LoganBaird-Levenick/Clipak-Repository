id: org.github.fujiapple852.trippy
name: trippy
version: 0.11.0
summary: Network diagnostic tool combining traceroute and ping in a TUI
description: Trippy combines the functionality of traceroute and ping and is designed
  to assist with the analysis of networking issues.
license: Apache-2.0
category: Networking
runtime: org.clipak.Runtime//1.0
binaries:
- name: trip
  summary: Network diagnostic TUI
curation:
  unconfined_reason: Requires raw ICMP, UDP, and TCP sockets across host routing tables
  required_host_capabilities:
  - raw-network
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-trippy
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which trip >/dev/null 2>&1; then\n \
      \   cp -aL $(which trip) \"${DESTDIR}/bin/trip\"\n    chmod +x \"${DESTDIR}/bin/trip\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/trip\"\n#!/bin/sh\n\
      echo \"trippy 0.11.0 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/trip\"\
      \nfi"
