id: org.k8s.kubectl
name: kubectl
version: 1.31.1
summary: Kubernetes cluster control CLI
description: kubectl controls the Kubernetes cluster manager, managing pods, deployments,
  services, ingress, and cluster infrastructure.
license: Apache-2.0
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: kubectl
  summary: Kubernetes control CLI
curation:
  unconfined_reason: Requires access to host network, port-forwarding, and certificates
  required_host_capabilities:
  - host-filesystem
  - host-sockets
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-kubectl
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which kubectl >/dev/null 2>&1; then\n\
      \    cp -aL $(which kubectl) \"${DESTDIR}/bin/kubectl\"\n    chmod +x \"${DESTDIR}/bin/kubectl\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/kubectl\"\n\
      #!/bin/sh\necho \"kubectl 1.31.1 (Clipak DDI unconfined developer tool)\"\n\
      if [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/kubectl\"\nfi"
