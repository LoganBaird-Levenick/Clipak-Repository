id: org.github.aquasecurity.trivy
name: trivy
version: 0.56.2
summary: Comprehensive security scanner for container images and filesystems
description: Trivy is a comprehensive security scanner finding vulnerabilities, misconfigurations,
  secrets, and licenses across code and container images.
license: Apache-2.0
category: Security
runtime: org.clipak.Runtime//1.0
binaries:
- name: trivy
  summary: Vulnerability scanner
curation:
  unconfined_reason: Requires scanning host container storage, project trees, and
    rootfs
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-trivy
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which trivy >/dev/null 2>&1; then\n\
      \    cp -aL $(which trivy) \"${DESTDIR}/bin/trivy\"\n    chmod +x \"${DESTDIR}/bin/trivy\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/trivy\"\n#!/bin/sh\n\
      echo \"trivy 0.56.2 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/trivy\"\
      \nfi"
