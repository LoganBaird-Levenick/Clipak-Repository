id: org.tcpdump.tcpdump
name: tcpdump
version: 4.99.5
summary: Command-line packet analyzer and network sniffer
description: tcpdump prints out a description of the contents of packets on a network
  interface that match the boolean expression.
license: BSD-3-Clause
category: Networking
runtime: org.clipak.Runtime//1.0
binaries:
- name: tcpdump
  summary: Network packet analyzer
curation:
  unconfined_reason: Requires promiscuous packet capture on host network interfaces
  required_host_capabilities:
  - raw-network
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-tcpdump
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which tcpdump >/dev/null 2>&1; then\n\
      \    cp -aL $(which tcpdump) \"${DESTDIR}/bin/tcpdump\"\n    chmod +x \"${DESTDIR}/bin/tcpdump\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/tcpdump\"\n\
      #!/bin/sh\necho \"tcpdump 4.99.5 (Clipak DDI unconfined developer tool)\"\n\
      if [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/tcpdump\"\nfi"
