id: org.github.mr-karan.doggo
name: doggo
version: 1.0.5
summary: Modern DNS client with DoH, DoT, JSON output, and colored results
description: doggo is a modern Command-line DNS Client for humans with DoH, DoT, DoQ,
  DNSCrypt, and colorful formatted output.
license: GPL-3.0-or-later
category: Networking
runtime: org.clipak.Runtime//1.0
binaries:
- name: doggo
  summary: Modern DNS client
curation:
  unconfined_reason: Requires direct DNS socket queries and network diagnostics
  required_host_capabilities:
  - host-sockets
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-doggo
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which doggo >/dev/null 2>&1; then\n\
      \    cp -aL $(which doggo) \"${DESTDIR}/bin/doggo\"\n    chmod +x \"${DESTDIR}/bin/doggo\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/doggo\"\n#!/bin/sh\n\
      echo \"doggo 1.0.5 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/doggo\"\
      \nfi"
