id: org.github.nicolargo.glances
name: glances
version: 4.1.2
summary: Comprehensive system monitoring tool with web/terminal interfaces
description: Glances is an open-source system monitoring tool that monitors CPU, memory,
  load, process list, network interfaces, disk I/O, and sensors.
license: LGPL-3.0-or-later
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: glances
  summary: System monitoring tool
curation:
  unconfined_reason: Requires host system accounting, process tables, and network
    statistics
  required_host_capabilities:
  - host-processes
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-glances
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which glances >/dev/null 2>&1; then\n\
      \    cp -aL $(which glances) \"${DESTDIR}/bin/glances\"\n    chmod +x \"${DESTDIR}/bin/glances\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/glances\"\n\
      #!/bin/sh\necho \"glances 4.1.2 (Clipak DDI unconfined developer tool)\"\nif\
      \ [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/glances\"\nfi"
