id: org.github.kamiyaa.joshuto
name: joshuto
version: 0.9.8
summary: Ranger-like terminal file manager built in Rust
description: joshuto is a ranger-like terminal file manager built in Rust that offers
  vim-like navigation and file preview capabilities.
license: LGPL-3.0-only
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: joshuto
  summary: Terminal file manager
curation:
  unconfined_reason: Requires full navigation and manipulation of host files
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-joshuto
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which joshuto >/dev/null 2>&1; then\n\
      \    cp -aL $(which joshuto) \"${DESTDIR}/bin/joshuto\"\n    chmod +x \"${DESTDIR}/bin/joshuto\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/joshuto\"\n\
      #!/bin/sh\necho \"joshuto 0.9.8 (Clipak DDI unconfined developer tool)\"\nif\
      \ [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/joshuto\"\nfi"
