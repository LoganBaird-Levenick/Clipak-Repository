id: org.dest-unreach.socat
name: socat
version: 1.8.0.1
summary: Multipurpose relay for bidirectional data transfer across streams
description: socat establishes two bidirectional byte streams and transfers data between
  them across files, pipes, devices, and sockets.
license: GPL-2.0-only
category: Networking
runtime: org.clipak.Runtime//1.0
binaries:
- name: socat
  summary: Multipurpose socket relay
curation:
  unconfined_reason: Requires bridging host Unix domain sockets, PTYs, and network
    streams
  required_host_capabilities:
  - host-sockets
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-socat
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which socat >/dev/null 2>&1; then\n\
      \    cp -aL $(which socat) \"${DESTDIR}/bin/socat\"\n    chmod +x \"${DESTDIR}/bin/socat\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/socat\"\n#!/bin/sh\n\
      echo \"socat 1.8.0.1 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/socat\"\
      \nfi"
