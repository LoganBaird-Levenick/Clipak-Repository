id: org.github.theryangeary.choose
name: choose
version: 1.3.4
summary: Human-friendly and fast alternative to cut and awk
description: choose is a human-friendly and fast alternative to cut and (sometimes)
  awk with Python-style negative indexing.
license: GPL-3.0-or-later
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: choose
  summary: Field selection filter
curation:
  unconfined_reason: Requires terminal pipe slicing of host stdout streams
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-choose
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which choose >/dev/null 2>&1; then\n\
      \    cp -aL $(which choose) \"${DESTDIR}/bin/choose\"\n    chmod +x \"${DESTDIR}/bin/choose\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/choose\"\n\
      #!/bin/sh\necho \"choose 1.3.4 (Clipak DDI unconfined developer tool)\"\nif\
      \ [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/choose\"\nfi"
