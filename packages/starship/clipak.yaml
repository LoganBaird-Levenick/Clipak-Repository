id: org.starship.starship
name: starship
version: 1.20.1
summary: Fast, ultra-customizable prompt for any shell
description: The minimal, blazing-fast, and infinitely customizable prompt for any
  shell, evaluating Git, package versions, and machine telemetry in milliseconds.
license: ISC
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: starship
  summary: Customizable shell prompt
curation:
  unconfined_reason: Requires evaluating host git status, battery stats, and package
    versions
  required_host_capabilities:
  - host-filesystem
  - host-processes
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-starship
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which starship >/dev/null 2>&1; then\n\
      \    cp -aL $(which starship) \"${DESTDIR}/bin/starship\"\n    chmod +x \"${DESTDIR}/bin/starship\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/starship\"\n\
      #!/bin/sh\necho \"starship 1.20.1 (Clipak DDI unconfined developer tool)\"\n\
      if [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/starship\"\nfi"
