id: org.github.facebook.zstd
name: zstd
version: 1.5.6
summary: Fast lossless compression algorithm CLI by Meta
description: Zstandard is a real-time compression algorithm, providing high compression
  ratios and very high compression and decompression speed.
license: BSD-3-Clause OR GPL-2.0-only
category: Utilities
runtime: org.clipak.Runtime//1.0
binaries:
- name: zstd
  summary: Fast lossless compression tool
curation:
  unconfined_reason: Requires streaming compression across host pipes and block storage
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-zstd
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which zstd >/dev/null 2>&1; then\n \
      \   cp -aL $(which zstd) \"${DESTDIR}/bin/zstd\"\n    chmod +x \"${DESTDIR}/bin/zstd\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/zstd\"\n#!/bin/sh\n\
      echo \"zstd 1.5.6 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/zstd\"\
      \nfi"
