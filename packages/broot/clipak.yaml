id: org.dystroy.broot
name: broot
version: 1.44.2
summary: Interactive tree exploration and filesystem navigation
description: broot is a new way to see and navigate directory trees in your terminal,
  with search, overview, and command execution on host files.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: broot
  summary: Interactive tree explorer
curation:
  unconfined_reason: Requires unconfined access to traverse and manipulate host directory
    hierarchies
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-broot
    command: 'mkdir -p "${DESTDIR}/bin"

      cp -a /usr/bin/broot "${DESTDIR}/bin/broot" 2>/dev/null || which broot >/dev/null
      2>&1 && cp -a $(which broot) "${DESTDIR}/bin/broot" || true

      chmod +x "${DESTDIR}/bin/broot" 2>/dev/null || true'
