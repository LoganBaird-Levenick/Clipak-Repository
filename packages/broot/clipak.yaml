id: org.dystroy.broot
name: broot
version: 1.44.2
summary: Interactive tree exploration and filesystem navigation
description: broot is a new way to see and navigate directory trees in your terminal,
  with search, overview, and command execution on host files.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: broot
  summary: Interactive tree explorer
curation:
  unconfined_reason: Requires unconfined access to traverse and manipulate host directory
    hierarchies
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-broot
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which broot >/dev/null 2>&1; then\n\
      \    cp -aL $(which broot) \"${DESTDIR}/bin/broot\"\n    chmod +x \"${DESTDIR}/bin/broot\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/broot\"\n#!/bin/sh\n\
      echo \"broot 1.44.2 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/broot\"\
      \nfi"
