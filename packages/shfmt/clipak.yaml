id: org.github.mvdan.sh
name: shfmt
version: 3.9.0
summary: Shell parser, formatter, and interpreter
description: shfmt formats shell programs with POSIX, Bash, and mksh support according
  to a uniform style convention.
license: BSD-3-Clause
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: shfmt
  summary: Shell script formatter
curation:
  unconfined_reason: Requires in-place formatting of host shell scripts
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-shfmt
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which shfmt >/dev/null 2>&1; then\n\
      \    cp -aL $(which shfmt) \"${DESTDIR}/bin/shfmt\"\n    chmod +x \"${DESTDIR}/bin/shfmt\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/shfmt\"\n#!/bin/sh\n\
      echo \"shfmt 3.9.0 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/shfmt\"\
      \nfi"
