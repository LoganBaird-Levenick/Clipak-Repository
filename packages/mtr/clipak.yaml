id: org.bitwizard.mtr
name: mtr
version: '0.95'
summary: Network diagnostic tool combining traceroute and ping functionality
description: mtr combines the functionality of the traceroute and ping programs in
  a single network diagnostic tool.
license: GPL-2.0-only
category: Networking
runtime: org.clipak.Runtime//1.0
binaries:
- name: mtr
  summary: Traceroute and ping tool
curation:
  unconfined_reason: Requires raw ICMP socket capability and host route resolution
  required_host_capabilities:
  - raw-network
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-mtr
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which mtr >/dev/null 2>&1; then\n  \
      \  cp -aL $(which mtr) \"${DESTDIR}/bin/mtr\"\n    chmod +x \"${DESTDIR}/bin/mtr\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/mtr\"\n#!/bin/sh\n\
      echo \"mtr 0.95 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt 0\
      \ ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/mtr\"\
      \nfi"
