id: org.gnu.screen
name: screen
version: 5.0.0
summary: Full-screen terminal multiplexer with session detach
description: Screen is a full-screen window manager that multiplexes a physical terminal
  between several processes, typically interactive shells.
license: GPL-3.0-or-later
category: Utilities
runtime: org.clipak.Runtime//1.0
binaries:
- name: screen
  summary: Terminal multiplexer
curation:
  unconfined_reason: Requires terminal PTY management and host session survival
  required_host_capabilities:
  - host-processes
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-screen
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which screen >/dev/null 2>&1; then\n\
      \    cp -aL $(which screen) \"${DESTDIR}/bin/screen\"\n    chmod +x \"${DESTDIR}/bin/screen\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/screen\"\n\
      #!/bin/sh\necho \"screen 5.0.0 (Clipak DDI unconfined developer tool)\"\nif\
      \ [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/screen\"\nfi"
