id: "org.fastfetch.fastfetch"
name: "fastfetch"
version: "2.68.1"
summary: "High-performance host system, hardware, and kernel diagnostic fetcher"
description: "fastfetch is a fast and feature-rich system information tool. Within Clipak, it accesses native host hardware sensors, DMI/SMBIOS tables, GPU devices, and kernel drivers directly."
license: "MIT"
category: "Diagnostics"
runtime: "org.clipak.Runtime//1.0"
binaries:
  - name: "fastfetch"
    summary: "System information fetcher"
curation:
  unconfined_reason: "Requires unconfined access to /sys, /proc, /dev, DMI tables, and hardware sensors to report accurate host operating system metrics"
  required_host_capabilities:
    - "hardware-sensors"
    - "raw-devices"
    - "proc-sysfs"
  flatpak_incompatible: true
build:
  steps:
    - name: "bundle-fastfetch"
      command: |
        mkdir -p "${DESTDIR}/bin" "${DESTDIR}/share"
        cp -a /usr/bin/fastfetch "${DESTDIR}/bin/fastfetch"
        chmod +x "${DESTDIR}/bin/fastfetch"
        if [ -d /usr/share/fastfetch ]; then cp -a /usr/share/fastfetch "${DESTDIR}/share/"; fi
