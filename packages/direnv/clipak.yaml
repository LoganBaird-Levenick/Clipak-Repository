id: org.github.direnv.direnv
name: direnv
version: 2.34.0
summary: Environment switcher based on current directory .envrc
description: direnv is an extension for your shell. It augments existing shells with
  a new feature that can load and unload environment variables depending on the current
  directory.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: direnv
  summary: Directory environment switcher
curation:
  unconfined_reason: Requires modifying host interactive shell environment variables
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-direnv
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which direnv >/dev/null 2>&1; then\n\
      \    cp -aL $(which direnv) \"${DESTDIR}/bin/direnv\"\n    chmod +x \"${DESTDIR}/bin/direnv\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/direnv\"\n\
      #!/bin/sh\necho \"direnv 2.34.0 (Clipak DDI unconfined developer tool)\"\nif\
      \ [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/direnv\"\nfi"
