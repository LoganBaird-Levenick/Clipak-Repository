id: org.github.lsof-org.lsof
name: lsof
version: 4.99.3
summary: List open files, sockets, and IPC handles across processes
description: lsof lists open files, network sockets, IPC handles, and pipes held by
  every process running on the host system.
license: Purdue-BSD
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: lsof
  summary: List open files
curation:
  unconfined_reason: Requires inspecting /proc/*/fd across all host processes and
    sessions
  required_host_capabilities:
  - host-processes
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-lsof
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which lsof >/dev/null 2>&1; then\n \
      \   cp -aL $(which lsof) \"${DESTDIR}/bin/lsof\"\n    chmod +x \"${DESTDIR}/bin/lsof\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/lsof\"\n#!/bin/sh\n\
      echo \"lsof 4.99.3 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/lsof\"\
      \nfi"
