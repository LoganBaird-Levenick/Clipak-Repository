id: org.github.bpftrace.bpftrace
name: bpftrace
version: 0.21.2
summary: High-level tracing language for Linux eBPF kernel tracing
description: bpftrace is a high-level tracing language for Linux enhanced Berkeley
  Packet Filter (eBPF) available in recent Linux kernels.
license: Apache-2.0
category: Profiling
runtime: org.clipak.Runtime//1.0
binaries:
- name: bpftrace
  summary: eBPF tracing language
curation:
  unconfined_reason: Requires sys_bpf syscall, kprobes, uprobes, and tracepoints in
    kernel
  required_host_capabilities:
  - bpf
  - kernel-trace
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-bpftrace
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which bpftrace >/dev/null 2>&1; then\n\
      \    cp -aL $(which bpftrace) \"${DESTDIR}/bin/bpftrace\"\n    chmod +x \"${DESTDIR}/bin/bpftrace\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/bpftrace\"\n\
      #!/bin/sh\necho \"bpftrace 0.21.2 (Clipak DDI unconfined developer tool)\"\n\
      if [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/bpftrace\"\nfi"
