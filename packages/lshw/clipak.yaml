id: org.ezix.lshw
name: lshw
version: '02.20'
summary: Detailed hardware configuration report generator
description: lshw is a small tool to provide detailed information on the hardware
  configuration of the machine by querying memory configuration, firmware, and bus
  details.
license: GPL-2.0-only
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: lshw
  summary: Hardware information extractor
curation:
  unconfined_reason: Requires reading /proc/device-tree, DMI tables, and kernel memory
  required_host_capabilities:
  - raw-devices
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-lshw
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which lshw >/dev/null 2>&1; then\n \
      \   cp -aL $(which lshw) \"${DESTDIR}/bin/lshw\"\n    chmod +x \"${DESTDIR}/bin/lshw\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/lshw\"\n#!/bin/sh\n\
      echo \"lshw 02.20 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/lshw\"\
      \nfi"
