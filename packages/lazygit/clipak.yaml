id: org.github.jesseduffield.lazygit
name: lazygit
version: 0.44.1
summary: Simple, keyboard-driven terminal UI for git commands
description: lazygit is a simple terminal UI for git commands, written in Go with
  the gocui library, making staging, interactive rebases, and stash trivial.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: lazygit
  summary: Terminal UI for git
curation:
  unconfined_reason: Requires interactive control over host git worktrees and credentials
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-lazygit
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which lazygit >/dev/null 2>&1; then\n\
      \    cp -aL $(which lazygit) \"${DESTDIR}/bin/lazygit\"\n    chmod +x \"${DESTDIR}/bin/lazygit\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/lazygit\"\n\
      #!/bin/sh\necho \"lazygit 0.44.1 (Clipak DDI unconfined developer tool)\"\n\
      if [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/lazygit\"\nfi"
