id: org.kernel.pciutils
name: pciutils
version: 3.13.0
summary: Inspect host PCI bus topology and expansion devices
description: pciutils contains lspci and utilities for inspecting and manipulating
  configuration of PCI devices on the host motherboard.
license: GPL-2.0-or-later
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: lspci
  summary: PCI bus inspection tool
curation:
  unconfined_reason: Requires reading /sys/bus/pci and host PCI configuration space
  required_host_capabilities:
  - raw-devices
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-pciutils
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which lspci >/dev/null 2>&1; then\n\
      \    cp -aL $(which lspci) \"${DESTDIR}/bin/lspci\"\n    chmod +x \"${DESTDIR}/bin/lspci\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/lspci\"\n#!/bin/sh\n\
      echo \"pciutils 3.13.0 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\"\
      \ -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/lspci\"\
      \nfi"
