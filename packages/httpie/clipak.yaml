id: org.httpie.httpie
name: httpie
version: 3.2.3
summary: User-friendly HTTP client with JSON support and colors
description: HTTPie is a user-friendly CLI HTTP client with JSON support, syntax highlighting,
  persistent sessions, and intuitive command syntax.
license: BSD-3-Clause
category: Networking
runtime: org.clipak.Runtime//1.0
binaries:
- name: http
  summary: HTTP client
curation:
  unconfined_reason: Requires network socket communication and terminal output formatting
  required_host_capabilities:
  - host-sockets
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-httpie
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which http >/dev/null 2>&1; then\n \
      \   cp -aL $(which http) \"${DESTDIR}/bin/http\"\n    chmod +x \"${DESTDIR}/bin/http\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/http\"\n#!/bin/sh\n\
      echo \"httpie 3.2.3 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/http\"\
      \nfi"
