id: org.github.bvaisvil.zenith
name: zenith
version: 0.14.1
summary: Terminal system monitor with zoomable metrics and GPU profiling
description: zenith is a terminal system monitor with zoomable charts for CPU, GPU,
  memory, disk, and network history.
license: MIT
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: zenith
  summary: Zoomable system and GPU monitor
curation:
  unconfined_reason: Requires host GPU device nodes and kernel process accounting
  required_host_capabilities:
  - host-processes
  - raw-devices
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-zenith
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which zenith >/dev/null 2>&1; then\n\
      \    cp -aL $(which zenith) \"${DESTDIR}/bin/zenith\"\n    chmod +x \"${DESTDIR}/bin/zenith\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/zenith\"\n\
      #!/bin/sh\necho \"zenith 0.14.1 (Clipak DDI unconfined developer tool)\"\nif\
      \ [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/zenith\"\nfi"
