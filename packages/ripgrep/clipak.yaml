id: org.ripgrep.rg
name: ripgrep
version: 15.2.0
summary: Line-oriented search tool that recursively searches current directory for
  a regex pattern
description: ripgrep is a line-oriented search tool that recursively searches your
  current directory for a regex pattern. Inside Clipak, it executes unconfined across
  arbitrary host mount points and project hierarchies.
license: Unlicense OR MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: rg
  summary: High-performance code search
curation:
  unconfined_reason: Requires unconfined read access across host filesystem trees
    (/home, /var, /etc, /tmp) to search arbitrary developer codebases
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-ripgrep
    command: 'mkdir -p "${DESTDIR}/bin"

      cp -a /usr/bin/rg "${DESTDIR}/bin/rg" 2>/dev/null || which rg >/dev/null 2>&1
      && cp -a $(which rg) "${DESTDIR}/bin/rg" || true

      chmod +x "${DESTDIR}/bin/rg" 2>/dev/null || true'
