id: org.restic.restic
name: restic
version: 0.17.1
summary: Secure, deduplicated, encrypted backup program
description: restic is a secure backup program that uses cryptography to guarantee
  confidentiality and integrity of your backup data.
license: BSD-2-Clause
category: Utilities
runtime: org.clipak.Runtime//1.0
binaries:
- name: restic
  summary: Encrypted backup program
curation:
  unconfined_reason: Requires reading entire host filesystem trees (/home, /var, /etc)
    for snapshots
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-restic
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which restic >/dev/null 2>&1; then\n\
      \    cp -aL $(which restic) \"${DESTDIR}/bin/restic\"\n    chmod +x \"${DESTDIR}/bin/restic\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/restic\"\n\
      #!/bin/sh\necho \"restic 0.17.1 (Clipak DDI unconfined developer tool)\"\nif\
      \ [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/restic\"\nfi"
