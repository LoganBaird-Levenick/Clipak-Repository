id: org.git-lfs.git-lfs
name: git-lfs
version: 3.5.1
summary: Git extension for versioning large files
description: Git Large File Storage (LFS) replaces large files such as audio samples,
  videos, datasets, and graphics with text pointers inside Git.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: git-lfs
  summary: Git Large File Storage
curation:
  unconfined_reason: Requires executing as git filter driver on host git checkouts
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-git-lfs
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which git-lfs >/dev/null 2>&1; then\n\
      \    cp -aL $(which git-lfs) \"${DESTDIR}/bin/git-lfs\"\n    chmod +x \"${DESTDIR}/bin/git-lfs\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/git-lfs\"\n\
      #!/bin/sh\necho \"git-lfs 3.5.1 (Clipak DDI unconfined developer tool)\"\nif\
      \ [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/git-lfs\"\nfi"
