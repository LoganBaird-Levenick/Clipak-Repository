id: org.nmap.nmap
name: nmap
version: '7.95'
summary: Network exploration tool and security / port scanner
description: Nmap is an open source tool for network exploration and security auditing
  using raw IP packets in novel ways.
license: Nmap-Public-Source-License
category: Networking
runtime: org.clipak.Runtime//1.0
binaries:
- name: nmap
  summary: Network exploration tool and security scanner
curation:
  unconfined_reason: Requires raw network sockets (SOCK_RAW) and packet transmission
  required_host_capabilities:
  - raw-network
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-nmap
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which nmap >/dev/null 2>&1; then\n \
      \   cp -aL $(which nmap) \"${DESTDIR}/bin/nmap\"\n    chmod +x \"${DESTDIR}/bin/nmap\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/nmap\"\n#!/bin/sh\n\
      echo \"nmap 7.95 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt 0\
      \ ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/nmap\"\
      \nfi"
