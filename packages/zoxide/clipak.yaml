id: org.github.ajeetdsouza.zoxide
name: zoxide
version: 0.9.6
summary: Smarter cd command tracking directory usage frecency
description: zoxide is a smarter cd command, inspired by z and autojump. It remembers
  which directories you use most frequently, so you can jump to them in just a few
  keystrokes.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: zoxide
  summary: Frecency directory jumper
curation:
  unconfined_reason: Requires access to host shell environment and host directory
    navigation
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-zoxide
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which zoxide >/dev/null 2>&1; then\n\
      \    cp -aL $(which zoxide) \"${DESTDIR}/bin/zoxide\"\n    chmod +x \"${DESTDIR}/bin/zoxide\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/zoxide\"\n\
      #!/bin/sh\necho \"zoxide 0.9.6 (Clipak DDI unconfined developer tool)\"\nif\
      \ [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/zoxide\"\nfi"
