id: org.github.wagoodman.dive
name: dive
version: 0.12.0
summary: Tool for exploring container layers and discovering wasted space
description: dive is a tool for exploring a docker or OCI image, layer contents, and
  discovering ways to shrink your image size.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: dive
  summary: Docker image layer explorer
curation:
  unconfined_reason: Requires connecting to host Docker/Podman sockets and container
    storage
  required_host_capabilities:
  - host-sockets
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-dive
    command: 'mkdir -p "${DESTDIR}/bin"

      cp -a /usr/bin/dive "${DESTDIR}/bin/dive" 2>/dev/null || which dive >/dev/null
      2>&1 && cp -a $(which dive) "${DESTDIR}/bin/dive" || true

      chmod +x "${DESTDIR}/bin/dive" 2>/dev/null || true'
