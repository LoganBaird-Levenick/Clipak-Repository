id: org.github.sharkdp.hexyl
name: hexyl
version: 0.14.0
summary: Colored command-line hex viewer
description: hexyl is a command-line hex viewer designed for terminal output that
  uses colored bytes to distinguish categories of bytes.
license: Apache-2.0 OR MIT
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: hexyl
  summary: Colored hex viewer
curation:
  unconfined_reason: Requires reading host binary files, raw disk images, and payloads
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-hexyl
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which hexyl >/dev/null 2>&1; then\n\
      \    cp -aL $(which hexyl) \"${DESTDIR}/bin/hexyl\"\n    chmod +x \"${DESTDIR}/bin/hexyl\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/hexyl\"\n#!/bin/sh\n\
      echo \"hexyl 0.14.0 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/hexyl\"\
      \nfi"
