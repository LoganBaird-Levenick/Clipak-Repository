id: org.github.dandavison.delta
name: delta
version: 0.18.2
summary: Syntax-highlighting pager for git, diff, and grep output
description: delta is a syntax-highlighting pager for git, diff, and grep output with
  side-by-side view and line numbers.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: delta
  summary: Syntax-highlighting diff pager
curation:
  unconfined_reason: Requires host git pager integration and terminal terminal styling
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-delta
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which delta >/dev/null 2>&1; then\n\
      \    cp -aL $(which delta) \"${DESTDIR}/bin/delta\"\n    chmod +x \"${DESTDIR}/bin/delta\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/delta\"\n#!/bin/sh\n\
      echo \"delta 0.18.2 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/delta\"\
      \nfi"
