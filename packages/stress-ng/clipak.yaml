id: org.kernel.stress-ng
name: stress-ng
version: 0.18.05
summary: Stress test CPU, memory, I/O, network, and kernel subsystems
description: stress-ng will stress test a computer system in various selectable ways,
  verifying hardware and thermal stability under heavy load.
license: GPL-2.0-or-later
category: Profiling
runtime: org.clipak.Runtime//1.0
binaries:
- name: stress-ng
  summary: System stress tester
curation:
  unconfined_reason: Requires stressing host kernel subsystems, memory allocators,
    and hardware
  required_host_capabilities:
  - host-processes
  - kernel-trace
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-stress-ng
    command: 'mkdir -p "${DESTDIR}/bin"

      cp -a /usr/bin/stress-ng "${DESTDIR}/bin/stress-ng" 2>/dev/null || which stress-ng
      >/dev/null 2>&1 && cp -a $(which stress-ng) "${DESTDIR}/bin/stress-ng" || true

      chmod +x "${DESTDIR}/bin/stress-ng" 2>/dev/null || true'
