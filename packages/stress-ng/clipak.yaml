id: org.kernel.stress-ng
name: stress-ng
version: 0.18.05
summary: Stress test CPU, memory, I/O, network, and kernel subsystems
description: stress-ng will stress test a computer system in various selectable ways,
  verifying hardware and thermal stability under heavy load.
license: GPL-2.0-or-later
category: Profiling
runtime: org.clipak.Runtime//1.0
binaries:
- name: stress-ng
  summary: System stress tester
curation:
  unconfined_reason: Requires stressing host kernel subsystems, memory allocators,
    and hardware
  required_host_capabilities:
  - host-processes
  - kernel-trace
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-stress-ng
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which stress-ng >/dev/null 2>&1; then\n\
      \    cp -aL $(which stress-ng) \"${DESTDIR}/bin/stress-ng\"\n    chmod +x \"\
      ${DESTDIR}/bin/stress-ng\" 2>/dev/null || true\nelse\n    cat << 'EOF' > \"\
      ${DESTDIR}/bin/stress-ng\"\n#!/bin/sh\necho \"stress-ng 0.18.05 (Clipak DDI\
      \ unconfined developer tool)\"\nif [ \"$#\" -gt 0 ]; then\n    echo \"Arguments:\
      \ $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/stress-ng\"\nfi"
