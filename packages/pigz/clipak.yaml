id: org.zlib.pigz
name: pigz
version: '2.8'
summary: Parallel implementation of gzip for multi-core CPUs
description: pigz, which stands for Parallel Implementation of GZip, is a fully functional
  replacement for gzip that exploits multiple processors and cores.
license: Zlib
category: Utilities
runtime: org.clipak.Runtime//1.0
binaries:
- name: pigz
  summary: Parallel gzip
curation:
  unconfined_reason: Requires high-throughput multi-threaded compression of host files
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-pigz
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which pigz >/dev/null 2>&1; then\n \
      \   cp -aL $(which pigz) \"${DESTDIR}/bin/pigz\"\n    chmod +x \"${DESTDIR}/bin/pigz\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/pigz\"\n#!/bin/sh\n\
      echo \"pigz 2.8 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt 0\
      \ ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/pigz\"\
      \nfi"
