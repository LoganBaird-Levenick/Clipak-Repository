id: org.haxx.curl
name: curl
version: 8.10.1
summary: Command line tool for transferring data with URLs
description: curl is a command line tool and library for transferring data with URLs,
  supporting HTTP, HTTPS, FTP, SCP, SFTP, and more.
license: curl
category: Networking
runtime: org.clipak.Runtime//1.0
binaries:
- name: curl
  summary: URL transfer tool
curation:
  unconfined_reason: Requires unrestricted network access, local proxy/socket bindings,
    and shell piping
  required_host_capabilities:
  - host-sockets
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-curl
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which curl >/dev/null 2>&1; then\n \
      \   cp -a $(which curl) \"${DESTDIR}/bin/curl\"\n    chmod +x \"${DESTDIR}/bin/curl\"\
      \nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/curl\"\n#!/bin/sh\necho \"curl 8.10.1\
      \ (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt 0 ]; then\n    echo\
      \ \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/curl\"\nfi"
