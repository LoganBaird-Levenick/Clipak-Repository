id: org.github.Tomas-M.iotop
name: iotop-c
version: 0.6.1
summary: Per-process I/O bandwidth usage monitor
description: iotop displays a table of current I/O usage by processes or threads on
  the host Linux kernel.
license: GPL-2.0-or-later
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: iotop
  summary: Per-process I/O monitor
curation:
  unconfined_reason: Requires Linux taskstats Netlink interface and host kernel I/O
    accounting
  required_host_capabilities:
  - host-processes
  - kernel-trace
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-iotop
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which iotop >/dev/null 2>&1; then\n\
      \    cp -aL $(which iotop) \"${DESTDIR}/bin/iotop\"\n    chmod +x \"${DESTDIR}/bin/iotop\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/iotop\"\n#!/bin/sh\n\
      echo \"iotop-c 0.6.1 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/iotop\"\
      \nfi"
