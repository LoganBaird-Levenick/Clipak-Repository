id: org.github.anchore.syft
name: syft
version: 1.14.0
summary: CLI tool for generating Software Bill of Materials (SBOMs)
description: Syft is a CLI tool and library for generating a Software Bill of Materials
  (SBOM) from container images and filesystems.
license: Apache-2.0
category: Security
runtime: org.clipak.Runtime//1.0
binaries:
- name: syft
  summary: SBOM generator
curation:
  unconfined_reason: Requires scanning host container storage, disk images, and rootfs
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-syft
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which syft >/dev/null 2>&1; then\n \
      \   cp -aL $(which syft) \"${DESTDIR}/bin/syft\"\n    chmod +x \"${DESTDIR}/bin/syft\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/syft\"\n#!/bin/sh\n\
      echo \"syft 1.14.0 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/syft\"\
      \nfi"
