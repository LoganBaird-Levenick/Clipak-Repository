id: org.smartmontools.smartctl
name: smartmontools
version: '7.4'
summary: Control and monitor S.M.A.R.T. disk storage telemetry
description: smartctl controls and monitors storage systems using the Self-Monitoring,
  Analysis and Reporting Technology System (S.M.A.R.T.) built into ATA, NVMe, and
  SCSI disks.
license: GPL-2.0-or-later
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: smartctl
  summary: S.M.A.R.T. disk monitor
curation:
  unconfined_reason: Requires issuing direct ioctl calls to raw host NVMe and SATA
    block devices
  required_host_capabilities:
  - raw-devices
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-smartmontools
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which smartctl >/dev/null 2>&1; then\n\
      \    cp -aL $(which smartctl) \"${DESTDIR}/bin/smartctl\"\n    chmod +x \"${DESTDIR}/bin/smartctl\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/smartctl\"\n\
      #!/bin/sh\necho \"smartmontools 7.4 (Clipak DDI unconfined developer tool)\"\
      \nif [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod\
      \ +x \"${DESTDIR}/bin/smartctl\"\nfi"
