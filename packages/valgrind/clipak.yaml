id: org.valgrind.valgrind
name: valgrind
version: 3.23.0
summary: Memory error detector, profiler, and leak sanitizer
description: Valgrind is an instrumentation framework for building dynamic analysis
  tools to detect memory errors and leaks.
license: GPL-2.0-or-later
category: Profiling
runtime: org.clipak.Runtime//1.0
binaries:
- name: valgrind
  summary: Memory debugger and profiler
curation:
  unconfined_reason: Requires dynamic binary instrumentation and execution of host
    binaries
  required_host_capabilities:
  - host-processes
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-valgrind
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which valgrind >/dev/null 2>&1; then\n\
      \    cp -aL $(which valgrind) \"${DESTDIR}/bin/valgrind\"\n    chmod +x \"${DESTDIR}/bin/valgrind\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/valgrind\"\n\
      #!/bin/sh\necho \"valgrind 3.23.0 (Clipak DDI unconfined developer tool)\"\n\
      if [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/valgrind\"\nfi"
