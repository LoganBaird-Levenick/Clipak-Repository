id: org.github.ahmetb.kubectx
name: kubectx
version: 0.9.5
summary: Fast switching between Kubernetes contexts and namespaces
description: kubectx and kubens are utilities to manage and switch between kubectl
  contexts and namespaces easily.
license: Apache-2.0
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: kubectx
  summary: Switch Kube contexts
- name: kubens
  summary: Switch Kube namespaces
curation:
  unconfined_reason: Requires modifying host kubeconfig files directly
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-kubectx
    command: 'mkdir -p "${DESTDIR}/bin"

      cp -a /usr/bin/kubectx "${DESTDIR}/bin/kubectx" 2>/dev/null || which kubectx
      >/dev/null 2>&1 && cp -a $(which kubectx) "${DESTDIR}/bin/kubectx" || true

      chmod +x "${DESTDIR}/bin/kubectx" 2>/dev/null || true'
