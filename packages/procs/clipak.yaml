id: org.github.dalance.procs
name: procs
version: 0.14.8
summary: Modern replacement for ps with color, paging, and tree view
description: procs is a modern replacement for ps written in Rust. It displays colored
  process trees, TCP/UDP listening ports, and cgroup accounting.
license: MIT
category: Diagnostics
runtime: org.clipak.Runtime//1.0
binaries:
- name: procs
  summary: Modern process viewer
curation:
  unconfined_reason: Requires host PID inspection, user mapping, and cgroup tracking
  required_host_capabilities:
  - host-processes
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-procs
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which procs >/dev/null 2>&1; then\n\
      \    cp -aL $(which procs) \"${DESTDIR}/bin/procs\"\n    chmod +x \"${DESTDIR}/bin/procs\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/procs\"\n#!/bin/sh\n\
      echo \"procs 0.14.8 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt\
      \ 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/procs\"\
      \nfi"
