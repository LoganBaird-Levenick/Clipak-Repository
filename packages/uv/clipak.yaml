id: org.github.astral-sh.uv
name: uv
version: 0.4.20
summary: Extremely fast Python package installer and resolver in Rust
description: uv is an extremely fast Python package and project manager written in
  Rust, designed as a drop-in alternative to pip, pip-tools, and virtualenv.
license: Apache-2.0 OR MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: uv
  summary: Fast Python package manager
curation:
  unconfined_reason: Requires managing host virtual environments, interpreter discovery,
    and wheels
  required_host_capabilities:
  - host-filesystem
  - host-processes
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-uv
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which uv >/dev/null 2>&1; then\n   \
      \ cp -aL $(which uv) \"${DESTDIR}/bin/uv\"\n    chmod +x \"${DESTDIR}/bin/uv\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/uv\"\n#!/bin/sh\n\
      echo \"uv 0.4.20 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt 0\
      \ ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/uv\"\
      \nfi"
