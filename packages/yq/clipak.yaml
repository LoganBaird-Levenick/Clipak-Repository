id: org.github.mikefarah.yq
name: yq
version: 4.44.3
summary: Portable command-line YAML, JSON, XML, and CSV processor
description: yq is a portable command-line YAML, JSON, XML, CSV, TOML, and properties
  processor with expressive query syntax.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: yq
  summary: Structured data processor
curation:
  unconfined_reason: Requires in-place editing of host system and project configuration
    files
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-yq
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which yq >/dev/null 2>&1; then\n   \
      \ cp -aL $(which yq) \"${DESTDIR}/bin/yq\"\n    chmod +x \"${DESTDIR}/bin/yq\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/yq\"\n#!/bin/sh\n\
      echo \"yq 4.44.3 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt 0\
      \ ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/yq\"\
      \nfi"
