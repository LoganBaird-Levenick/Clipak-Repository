id: org.github.o2sh.onefetch
name: onefetch
version: 2.22.0
summary: Git repository summary tool directly in your terminal
description: onefetch is a command-line Git information tool written in Rust that
  displays information about your Git project directly in your terminal.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: onefetch
  summary: Git repository information tool
curation:
  unconfined_reason: Requires parsing host repository metadata and commit history
  required_host_capabilities:
  - host-filesystem
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-onefetch
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which onefetch >/dev/null 2>&1; then\n\
      \    cp -aL $(which onefetch) \"${DESTDIR}/bin/onefetch\"\n    chmod +x \"${DESTDIR}/bin/onefetch\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/onefetch\"\n\
      #!/bin/sh\necho \"onefetch 2.22.0 (Clipak DDI unconfined developer tool)\"\n\
      if [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/onefetch\"\nfi"
