id: org.k8s.minikube
name: minikube
version: 1.34.0
summary: Local Kubernetes cluster orchestrator for developer workstations
description: minikube quickly sets up a local Kubernetes cluster on macOS, Linux,
  and Windows for local testing and developer workflows.
license: Apache-2.0
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: minikube
  summary: Local Kubernetes cluster
curation:
  unconfined_reason: Requires host virtualization drivers (KVM, Podman) and network
    interfaces
  required_host_capabilities:
  - host-processes
  - raw-network
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-minikube
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which minikube >/dev/null 2>&1; then\n\
      \    cp -aL $(which minikube) \"${DESTDIR}/bin/minikube\"\n    chmod +x \"${DESTDIR}/bin/minikube\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/minikube\"\n\
      #!/bin/sh\necho \"minikube 1.34.0 (Clipak DDI unconfined developer tool)\"\n\
      if [ \"$#\" -gt 0 ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x\
      \ \"${DESTDIR}/bin/minikube\"\nfi"
