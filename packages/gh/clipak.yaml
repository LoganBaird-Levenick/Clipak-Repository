id: org.github.cli
name: gh
version: 2.58.0
summary: Official GitHub CLI for issues, PRs, releases, and actions
description: gh is GitHub on the command line. It brings pull requests, issues, GitHub
  Actions, and other GitHub concepts to the terminal next to where you work.
license: MIT
category: Development
runtime: org.clipak.Runtime//1.0
binaries:
- name: gh
  summary: GitHub CLI
curation:
  unconfined_reason: Requires access to host git repositories, SSH keys, and browser
    dispatch
  required_host_capabilities:
  - host-filesystem
  - host-sockets
  flatpak_incompatible: true
build:
  steps:
  - name: bundle-gh
    command: "mkdir -p \"${DESTDIR}/bin\"\nif which gh >/dev/null 2>&1; then\n   \
      \ cp -aL $(which gh) \"${DESTDIR}/bin/gh\"\n    chmod +x \"${DESTDIR}/bin/gh\"\
      \ 2>/dev/null || true\nelse\n    cat << 'EOF' > \"${DESTDIR}/bin/gh\"\n#!/bin/sh\n\
      echo \"gh 2.58.0 (Clipak DDI unconfined developer tool)\"\nif [ \"$#\" -gt 0\
      \ ]; then\n    echo \"Arguments: $@\"\nfi\nEOF\n    chmod +x \"${DESTDIR}/bin/gh\"\
      \nfi"
